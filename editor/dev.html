<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STV2 dev editor</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --mut:#8b96a5; --fg:#e6edf3; --acc:#3fb950; --red:#f85149; --bd:#262d38 }
  body { background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; margin: 16px; }
  main { max-width: 680px; margin: 0 auto; }
</style>
<!-- Local development: the same editor the device's Theme tab mounts, with
     no device behind it (Send is disabled). Serve this directory over HTTP. -->
<main id="editor"></main>
<script src="dist/stv-editor.min.js"></script>
<script>
  window.ed = StvEditor.mount(document.getElementById('editor'), {
    api: null, location: { lat: -22.5647, lon: -47.4017 }, city: 'Limeira',
  });
</script>
