[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smalltv-companion"
version = "0.1.0"
description = "Composes the SmallTV screen on your computer (music, notifications, Steam, system) and pushes it to the device"
readme = "README.md"
license = { text = "WTFPL" }
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "numpy>=1.26",
  "requests>=2.31",
  "psutil>=5.9",
  "tomli-w>=1.0",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
smalltv-companion = "smalltv_companion.cli:main"

# Built-in plugins register here exactly like third-party ones do: a package
# that declares an entry point in this group becomes usable as `plugin = "<name>"`.
[project.entry-points."smalltv_companion.plugins"]
text = "smalltv_companion.plugins.text:TextPlugin"
system = "smalltv_companion.plugins.system:SystemPlugin"
media = "smalltv_companion.plugins.media:MediaPlugin"
notifications = "smalltv_companion.plugins.notifications:NotificationsPlugin"
steam = "smalltv_companion.plugins.steam:SteamPlugin"

[tool.setuptools.packages.find]
include = ["smalltv_companion*"]

[tool.setuptools.package-data]
smalltv_companion = ["config.example.toml", "web/*"]
